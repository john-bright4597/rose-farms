<!DOCTYPE html>

<html>

    <head>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <header class="top">
            <div class="top">
                <h2>
                    Rose Farms
                </h2>

                <div class="cart">
                    <a href="cart.html" class="cart-link">
                        <img src="cart-symbol.png" alt="cart logo" width="50" height="50">
                        <span class="cart-count">3</span>
                    </a>
                </div>
            </div>
        </header>

        <main class="shop-container">
            <h1>Our Farm Fresh Goods</h1>
            <div id="product-grid" class="grid"></div>
        </main>

        <script>
            const roses = [
                { name: "EGGS", price: "$6.70", img: "red-rose.png" },
                { name: "HOENY", price: "$6.70", img: "white-rose.png" },
                { name: "BOI", price: "$6.70", img: "pink-rose.png" },
                { name: "BOI", price: "$6.70", img: "yellow-rose.png" }
            ];

            const grid = document.getElementById('product-grid');

            roses.forEach(rose => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item-card';
                itemDiv.innerHTML = `
                    <img src="${rose.img}" alt="${rose.name}" class="item-img">
                    <h3 class="item-title">${rose.name}</h3>
                    <p class="item-price">${rose.price}</p>
                    <button class="add-btn">Add to Cart</button>`;

                    const button = itemDiv.querySelector('.add-btn');
                    button.addEventListener('click', () => {
                        console.log(`Added ${rose.name} to cart`);
                    });

                grid.appendChild(itemDiv);
            });
        </script>

    </body>
</html>
